[package]
name = "mewu-core"
version = "1.0.0-preview.1"
edition = "2021"
rust-version = "1.89"
license = "MPL-2.0"
description = "Persistent scene and agent domain for Mewu"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
uuid = { version = "1.27.0", features = ["v4"] }
thiserror = "2.0.21"
sha2 = "=0.10.9"
