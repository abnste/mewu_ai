[package]
name = "mewu-hooks"
version = "1.0.0"
edition = "2021"
license = "MPL-2.0"
description = "Persistent, bounded event trigger rules for Mewu"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
croner = "=4.0.2"
regex = "=1.13.1"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
