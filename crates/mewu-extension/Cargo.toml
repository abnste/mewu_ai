[package]
name = "mewu-extension"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
license = "MPL-2.0"
description = "Bounded executable JavaScript extensions and host protocol for Mewu"

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
schemars = "=1.2.2"
semver = "1.0"
thiserror = "2.0.21"
base64 = "0.22"

[[bin]]
name = "mewu-extension-worker"
path = "src/main.rs"
