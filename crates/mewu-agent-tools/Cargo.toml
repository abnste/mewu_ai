[package]
name = "mewu-agent-tools"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "General local execution primitives shared by Mewu agent engines"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"
sha2 = "=0.10.9"
regex = "=1.13.1"
tempfile = "=3.27.0"
globset = "=0.4.21"
ignore = "=0.4.34"
similar = "=3.2.1"
which = "=8.0.6"
