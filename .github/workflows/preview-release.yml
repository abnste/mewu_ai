name: Desktop release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-candidates-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            bundles: nsis
          - os: macos-14
            platform: darwin-aarch64
            bundles: app,dmg
          - os: ubuntu-22.04
            platform: linux-x86_64
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Audit public source
        run: node scripts/audit-public.mjs
      - name: Update Rust stable
        run: rustup update stable --no-self-update
      - name: Test source and release gate
        shell: bash
        run: |
          set -e
          node --experimental-vm-modules --test apps/desktop/src/*.test.mjs
          node --test scripts/release-contract.test.mjs scripts/release-staging.test.mjs
          npm run build
          cargo test --workspace --locked -- --test-threads=1
      - name: Verify Linux GLib source backport and optimized FFI
        if: runner.os == 'Linux' && !cancelled()
        shell: bash
        run: |
          set -e
          node scripts/check-glib-backport.mjs
          cargo test -p mewu-desktop --locked --release --test glib_variant_iter -- --nocapture
      - name: Build native candidate
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MEWU_BUILD_COMMIT: ${{ github.sha }}
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: Stage explicit native assets
        run: node scripts/prepare-release.mjs out/release-${{ matrix.platform }} ${{ matrix.platform }}
      - name: Preserve candidates for native installation tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mewu-${{ matrix.platform }}-${{ github.sha }}
          path: out/release-${{ matrix.platform }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      # CI success is source/build evidence. Publishing remains a coordinator
      # command requiring Windows, Mac, and Linux native installation receipts.
