name: Release Windows packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify tag and project version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v').Trim()
          [xml]$project = Get-Content -LiteralPath 'mewu_ai_Assistant.csproj'
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) { throw 'Project Version is missing.' }
          $projectVersion = $versionNode.InnerText.Trim()
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version $tagVersion does not match project version $projectVersion"
          }
          foreach ($field in @('AssemblyVersion','FileVersion')) {
            $node = $project.SelectSingleNode("/Project/PropertyGroup/$field")
            if ($null -eq $node -or $node.InnerText.Trim() -ne "$tagVersion.0") {
              throw "$field must be $tagVersion.0"
            }
          }
          $installer = Get-Content -Raw -LiteralPath 'installer/MewuAI.iss'
          if ($installer -notmatch ('#define MyAppVersion "' + [regex]::Escape($tagVersion) + '"')) {
            throw 'Installer MyAppVersion does not match the tag.'
          }
          if ($installer -notmatch ('VersionInfoVersion=' + [regex]::Escape($tagVersion) + '\.0')) {
            throw 'Installer VersionInfoVersion does not match the tag.'
          }
          if (-not (Test-Path -LiteralPath "docs/release-notes-v$tagVersion.md")) {
            throw "Release notes for $tagVersion are missing."
          }

      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore .\mewu_ai_Assistant.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency restore failed.' }

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list .\mewu_ai_Assistant.csproj package --vulnerable --include-transitive --format json | ConvertFrom-Json -AsHashtable
          if ($LASTEXITCODE -ne 0) { throw 'NuGet vulnerability audit failed.' }
          function Find-VulnerabilityLists($node) {
            if ($node -is [System.Collections.IDictionary]) {
              foreach ($entry in $node.GetEnumerator()) {
                if ($entry.Key -eq 'vulnerabilities' -and $entry.Value -and $entry.Value.Count -gt 0) { return $true }
                if (Find-VulnerabilityLists $entry.Value) { return $true }
              }
            } elseif ($node -is [System.Collections.IEnumerable] -and $node -isnot [string]) {
              foreach ($item in $node) { if (Find-VulnerabilityLists $item) { return $true } }
            }
            return $false
          }
          if (Find-VulnerabilityLists $report) { throw 'NuGet reports one or more vulnerable packages.' }

      - name: Build all release projects
        shell: pwsh
        run: |
          foreach ($project in @(
            '.\mewu_ai_Assistant.csproj',
            '.\tests\MewuAI.Tests\MewuAI.Tests.csproj',
            '.\tests\MewuAI.ProviderSmoke\MewuAI.ProviderSmoke.csproj'
          )) {
            dotnet build $project -c Release -p:Platform=x64 --no-restore -warnaserror
            if ($LASTEXITCODE -ne 0) { throw "Release build failed: $project" }
          }

      - name: Run release tests
        shell: pwsh
        run: |
          dotnet test .\tests\MewuAI.Tests\MewuAI.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed.' }

      - name: Restore self-contained runtime packs
        shell: pwsh
        run: |
          dotnet restore .\mewu_ai_Assistant.csproj --locked-mode -r win-x64 -p:Configuration=Release -p:Platform=x64 -p:SelfContained=true
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained runtime pack restore failed.' }

      - name: Publish self-contained app
        run: dotnet publish .\mewu_ai_Assistant.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true --no-restore -o .\artifacts\release\win-x64

      - name: Audit publish payload
        shell: pwsh
        run: |
          $publish = (Resolve-Path '.\artifacts\release\win-x64').Path
          $forbidden = Get-ChildItem -LiteralPath $publish -Recurse -File | Where-Object {
            $_.Extension -in '.pdb','.log','.jsonl','.tmp','.png','.jpg','.jpeg','.gif','.mp4','.webm','.avi','.mkv','.mov' -or
            $_.Name -in 'settings.json','.env' -or
            $_.FullName -match '[\\/](Credentials|Logs|History|Temp|Clipboard|Screenshots|Recordings)[\\/]'
          }
          if ($forbidden) {
            $forbidden.FullName | ForEach-Object { Write-Error "Forbidden release file: $_" }
            throw 'Release payload contains private or development files.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $publish 'MewuAI.exe'))) { throw 'MewuAI.exe is missing.' }
          if (-not (Test-Path -LiteralPath (Join-Path $publish 'THIRD-PARTY-NOTICES.md'))) { throw 'Third-party notices are missing.' }
          if (-not (Test-Path -LiteralPath (Join-Path $publish 'Licenses\DotNet-Windows-Library-License.txt'))) { throw 'Runtime license is missing.' }
          foreach ($license in @(
            'Licenses\Microsoft.Web.WebView2-LICENSE.txt',
            'Licenses\Microsoft.Web.WebView2-NOTICE.txt',
            'Licenses\Microsoft.WindowsAppSDK-LICENSE.txt',
            'Licenses\Microsoft.WindowsAppSDK-NOTICE.txt'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $publish $license))) { throw "Required license file is missing: $license" }
          }
          $unexpectedCultures = Get-ChildItem -LiteralPath $publish -Directory | Where-Object { $_.Name -match '^(cs|de|es|fr|it|ja|ko|pl|pt-BR|ru|tr|zh-Hant)$' }
          if ($unexpectedCultures) { throw "Unsupported satellite resources were published: $($unexpectedCultures.Name -join ', ')" }

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Path '.\artifacts\packages' -Force | Out-Null
          Compress-Archive -Path '.\artifacts\release\win-x64\*' -DestinationPath ".\artifacts\packages\MewuAI-Portable-$version-win-x64.zip" -CompressionLevel Optimal

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --version 6.7.1 --no-progress -y
          if ($LASTEXITCODE -notin 0, 1641, 3010) { throw "Inno Setup installation failed with exit code $LASTEXITCODE" }
          $languageDir = 'C:\Program Files (x86)\Inno Setup 6\Languages'
          $languageFile = Join-Path $languageDir 'ChineseSimplified.isl'
          $translationUrl = 'https://raw.githubusercontent.com/jrsoftware/issrc/6ef32198ef1f7b7b375cd4b6b90896c2a58eb4c2/Files/Languages/ChineseSimplified.isl'
          Invoke-WebRequest -Uri $translationUrl -OutFile $languageFile
          $translationHash = (Get-FileHash -LiteralPath $languageFile -Algorithm SHA256).Hash
          if ($translationHash -ne 'E0B0B350E2245F3C5E65586DFE43D574F6E7F06F2261149ABA284954B3FC9A8D') {
            throw "Unexpected ChineseSimplified.isl SHA-256: $translationHash"
          }

      - name: Build installer EXE
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler was not installed.' }
          & $compiler '.\installer\MewuAI.iss'

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem '.\artifacts\installer\*.exe','.\artifacts\packages\*.zip' -File | Sort-Object Name
          if ($files.Count -ne 2) { throw "Expected one installer and one portable ZIP, found $($files.Count)." }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path '.\artifacts\packages') 'SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $assets = @(
            ".\artifacts\installer\MewuAI-Setup-$version-win-x64.exe",
            ".\artifacts\packages\MewuAI-Portable-$version-win-x64.zip",
            '.\artifacts\packages\SHA256SUMS.txt',
            '.\docs\media\MewuAI-video-annotations.mp4'
          )
          if (gh release view $tag *> $null) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "MewuAI $version · 喵呜AI $version" --notes-file ".\docs\release-notes-v$version.md" --verify-tag
          }
