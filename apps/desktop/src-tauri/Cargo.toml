[package]
name = "mewu-desktop"
version = "1.1.1"
edition = "2021"
license = "MPL-2.0"
default-run = "mewu-desktop"

[[bin]]
name = "mewu"
path = "../../../tools/mewu-cli/main.rs"

[[bin]]
name = "mewu-plugin-validator"
path = "../../../tools/extension-market/native.rs"
test = false
required-features = ["catalog-validator"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
encoding_rs = "=0.8.42"
mewu-control = { path = "../../../crates/mewu-control" }
mewu-core = { path = "../../../crates/mewu-core" }
mewu-agent-runtime = { path = "../../../crates/mewu-agent-runtime" }
mewu-agent-tools = { path = "../../../crates/mewu-agent-tools" }
mewu-extension = { path = "../../../crates/mewu-extension" }
mewu-agent-workspace = { path = "../../../crates/mewu-agent-workspace" }
mewu-hooks = { path = "../../../crates/mewu-hooks" }
enigo = { version = "=0.6.1", default-features = false, features = ["x11rb"] }
tempfile = "=3.27.0"
rustyline = { version = "=18.0.1", default-features = false }
crossterm = "=0.29.0"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
tauri = { version = "=2.12.1", features = [ "tray-icon"] }
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-single-instance = "=2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"
serde_path_to_error = "=0.1.20"
chrono = "=0.4.45"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls", "system-proxy", "socks"] }
futures-util = "0.3"
eventsource-stream = "0.2"
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
gif = { version = "=0.14.2", default-features = false, features = ["std", "color_quant", "raii_no_panic"] }
rxing = { version = "=0.9.3", default-features = false, features = ["decoders", "multi_barcode_readers", "qrcode", "datamatrix", "aztec", "pdf417", "oned", "encoding_rs"] }
rfd = "=0.17.2"
arboard = "3"
zeroize = "1"
url = "2"
regex = "=1.13.1"
tiny_http = "=0.12.0"
same-file = "=1.0.6"
dirs = "=7.0.0"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
jsonschema = { version = "=0.58.6", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
semver = "=1.0.28"
sha2 = "=0.10.9"
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
ratex-parser = { git = "https://github.com/erweixin/RaTeX", rev = "776c1d37bafa3bf445a0ab9377c55fe77f7a0133" }
ratex-layout = { git = "https://github.com/erweixin/RaTeX", rev = "776c1d37bafa3bf445a0ab9377c55fe77f7a0133" }
ratex-types = { git = "https://github.com/erweixin/RaTeX", rev = "776c1d37bafa3bf445a0ab9377c55fe77f7a0133" }
ratex-svg = { git = "https://github.com/erweixin/RaTeX", rev = "776c1d37bafa3bf445a0ab9377c55fe77f7a0133", default-features = false, features = ["standalone"] }
ratex-unicode-font = { git = "https://github.com/erweixin/RaTeX", rev = "776c1d37bafa3bf445a0ab9377c55fe77f7a0133" }
roxmltree = "=0.21.1"
tauri-plugin-updater = "=2.13.2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = { version = "=0.9.8", default-features = false }

[target.'cfg(windows)'.dependencies]
tauri-runtime = "=2.12.1"
webview2-com = "=0.39.1"
wry = { version = "=0.57.0", default-features = false }
windows-capture = "=2.0.1"
windows = { version = "=0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_Media_Speech", "Win32_Media_Audio", "Win32_Globalization", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Performance", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Storage_Search", "Media_Editing", "Media_MediaProperties", "Media_Transcoding", "Win32_System_WinRT"] }
windows-future = "=0.3.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
plist = "=1.10.1"
tar = "=0.4.46"
flate2 = "=1.1.10"
libc = "0.2"
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication", "block2", "NSView", "NSControl", "NSButton", "NSPopUpButton", "NSAlert", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSIndexSet", "NSObject", "NSRange", "NSString", "NSObjCRuntime", "NSURL", "NSProcessInfo", "NSGeometry", "NSValue"] }
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["std", "UTType"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNObservation", "VNRequest", "VNRequestHandler", "VNTypes", "VNError", "objc2-core-foundation", "block2"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["std", "SCShareableContent", "SCStream", "SCScreenshotManager", "block2", "objc2-core-graphics", "objc2-core-foundation", "objc2-core-media", "dispatch2", "libc"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGImage", "CGDataProvider", "CGColorSpace"] }
block2 = "=0.6.2"
core-foundation = "=0.10.1"
objc2-av-foundation = {version = "=0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetTrack", "AVMediaFormat", "AVAssetImageGenerator", "AVAsynchronousKeyValueLoading", "block2", "objc2-core-foundation", "objc2-core-media", "objc2-core-graphics", "AVAssetExportSession", "AVVideoComposition", "AVAssetReader", "AVAssetReaderOutput", "AVAssetWriter", "AVAssetWriterInput", "AVVideoSettings", "AVAnimation", "AVComposition", "AVCompositionTrack", "objc2-quartz-core"] }
objc2-quartz-core = {version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAAnimation", "CAMediaTiming", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-media = {version = "=0.3.2", default-features = false, features = ["std", "CMTime", "objc2", "CMTimeRange", "CMBase", "CMSampleBuffer", "objc2-core-video", "CMFormatDescription", "CMSync", "objc2-core-audio-types", "CMBlockBuffer"] }
objc2-core-audio-types = {version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-video = {version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = {version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFBase", "CFData"] }
objc2-avf-audio = {version = "=0.3.2", default-features = false, features = ["std", "AVAudioSettings"] }
dispatch2 = {version = "=0.3.1", default-features = false, features = ["std", "block2", "objc2"] }

[target.'cfg(target_os = "linux")'.dependencies]
fdk-aac-sys = "=0.5.0"
gstreamer = { version = "=0.21.3", features = ["v1_20"] }
gstreamer-app = { version = "=0.21.2", features = ["v1_20"] }
gstreamer-video = { version = "=0.21.2", features = ["v1_20"] }
libloading = "=0.8.9"
gtk = "=0.18.2"
webkit2gtk = "=2.0.2"
gdkx11-sys = "=0.18.2"
x11rb = { version = "=0.13.2", features = ["randr"] }
rustix = { version = "=1.1.5", features = ["event", "fs", "net", "process"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-io = "=2.6.0"
futures-lite = "=2.6.1"
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant"] }

[dev-dependencies]
rxing = { version = "=0.9.3", default-features = false, features = ["encoders"] }
x11rb = { version = "=0.13.2", features = ["randr"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "=0.18.5"

[features]
catalog-validator = []
linux-x11-tests = []
linux-secret-service-tests = []
linux-worker-tests = []
linux-recording-tests = []
linux-ui-diagnostics = []

[[test]]
name = "linux_worker_factory"
path = "tests/linux_worker_factory.rs"
harness = false
required-features = ["linux-worker-tests"]

[[test]]
name = "linux_package_code_probe"
path = "tests/linux_package_code_probe.rs"
harness = false
required-features = ["linux-worker-tests"]

[[test]]
name = "linux_recording_codec"
path = "tests/linux_recording_codec.rs"
required-features = ["linux-recording-tests"]

[[test]]
name = "linux_wayland_recording_probe"
path = "tests/linux_wayland_recording_probe.rs"
harness = false
required-features = ["linux-recording-tests"]
