[workspace]
members = ["crates/mewu-core", "apps/desktop/src-tauri"]
resolver = "2"

# GTK3 consumers require glib 0.18. This exact source backports upstream
# PR 1343 (RUSTSEC-2024-0429); provenance is in docs/glib-backport.json.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
