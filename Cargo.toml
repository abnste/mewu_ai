[workspace]
members = ["crates/mewu-core", "crates/mewu-extension", "crates/mewu-control", "apps/desktop/src-tauri"]
resolver = "2"

# GTK3 consumers require glib 0.18. This exact source backports upstream
# PR 1343 (RUSTSEC-2024-0429); provenance is in docs/glib-backport.json.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
# Exact upstream installer/signature implementation; only adds in-memory release data.
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater-2.13.2" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# Local iteration keeps an optimized runtime without whole-program LTO.
# Published installers continue to use the release profile above.
[profile.daily]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
